version: '3.8'

services:
  mysql:
    image: mysql:8.4.5
    container_name: book-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_book
    ports:
      - '3307:3306'
    networks:
      - book-networks
    restart: unless-stopped

networks:
  book-networks:
    driver: bridge

# docker compose up -d
# -d: background mode